name: CI/CD Pipeline
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
 
jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Test
  # ─────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
 
      - name: Install dependencies
        run: npm ci
 
      - name: Run Jest tests
        run: npm test
 
  # ─────────────────────────────────────────────
  # JOB 2 — Deploy (only on push to main)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
 
      - name: Install dependencies
        run: npm ci --omit=dev
 
      - name: Deploy (simulate production deployment)
        run: |
          echo "=========================================="
          echo "  Deploying Matrix Software Implementation"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "  Time   : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "=========================================="
          echo "✅ Deployment complete."
        # 🔧 Replace the above `run` block with your real deploy command, e.g.:
        #   - SSH deploy: ssh user@host 'cd /app && git pull && npm ci && pm2 restart all'
        #   - Render/Railway: trigger their deploy hook via curl
        #   - Vercel: use `npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}`
 
  # ─────────────────────────────────────────────
  # JOB 3 — Smoke Test (runs after deploy)
  # ─────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
 
      - name: Install dependencies
        run: npm ci
 
      - name: Run smoke test
        run: node smoke-test.js