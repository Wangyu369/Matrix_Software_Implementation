name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Test
  # ─────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

  # ─────────────────────────────────────────────
  # JOB 2 — Build
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: |
          echo "Building Matrix Software Implementation..."
          mkdir -p dist
          cp matrix.js dist/matrix.js
          cp package.json dist/package.json
          echo "✅ Build complete. Files copied to /dist"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 3 — Deploy to Vercel
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "✅ Deployed to: $DEPLOY_URL"

      - name: Save deploy URL for smoke test
        run: echo "${{ env.DEPLOY_URL }}" > deploy-url.txt

      - name: Upload deploy URL
        uses: actions/upload-artifact@v4
        with:
          name: deploy-url
          path: deploy-url.txt
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 4 — Smoke Test (hits live Vercel URL)
  # ─────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download deploy URL
        uses: actions/download-artifact@v4
        with:
          name: deploy-url

      - name: Run function smoke test
        run: node smoke-test.js

      - name: Run HTTP smoke test (check live Vercel URL)
        run: |
          DEPLOY_URL=$(cat deploy-url.txt)
          echo "Checking live URL: $DEPLOY_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 401 ]; then
            echo "✅ Smoke test passed — site is reachable (HTTP $STATUS)"
            echo "ℹ️  401 = Vercel Authentication is ON (site is live but protected)"
          else
            echo "❌ Smoke test failed — site returned $STATUS (site may be down)"
            exit 1
          fi
